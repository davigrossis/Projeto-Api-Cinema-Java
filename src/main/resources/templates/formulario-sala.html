<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova Sala</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>
<body>
<div class="container mt-5">
    <h1 class="text-center">Adicionar Nova Sala</h1>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form action="/sala/salvar" method="post">
                <div class="form-group">
                    <label>Nome da sala:</label>
                    <input type="text" name="nome" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Tipo:</label>
                    <select name="tipo" class="form-control">
                        <option value="pequena">Sala Pequena (100 lugares)</option>
                        <option value="grande">Sala Grande (150 lugares)</option>
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="/" class="btn btn-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
