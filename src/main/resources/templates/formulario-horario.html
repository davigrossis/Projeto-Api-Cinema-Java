<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agendar Horário</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Agendar Novo Horário</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{/horarios/novo}" method="post">
                <div class="form-group">
                    <label>Filme:</label>
                    <input type="text" name="titulo" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Duração (minutos):</label>
                    <input type="number" name="duracao" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Sala:</label>
                    <select name="nomeSala" class="form-control">
                        <option th:each="sala : ${salas}" th:value="${sala.nome}" th:text="${sala.nome}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Horário (HH:mm):</label>
                    <input type="time" name="horario" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-primary">Agendar</button>
                    <a th:href="@{/horarios}" class="btn btn-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
